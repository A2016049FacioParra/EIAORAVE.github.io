<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}</style><title>Bulldog Rave Vol. 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: póster arriba, menú de escenarios fijo como "pulseras" de festival, programación en línea de tiempo vertical. Tema oscuro único (neón sobre muro de graffiti). */
:root{
  --wall:#0f1420;
  --wall-2:#171e2e;
  --line:#2a3348;
  --ink:#f3f5fa;
  --muted:#a3adc4;
  --pink:#ff3fa4;
  --lime:#c6ff2e;
  --cyan:#2ee6ff;
  --orange:#ffa62b;
  --violet:#a46bff;
  --f-display:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(circle at 12% 8%,rgba(255,63,164,.16),transparent 40%),radial-gradient(circle at 90% 30%,rgba(46,230,255,.12),transparent 45%),radial-gradient(circle at 30% 90%,rgba(198,255,46,.08),transparent 40%);
  background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

/* Hero */
.hero{display:grid;gap:16px;justify-items:center;text-align:center}
.poster{display:block;width:100%;max-width:640px;aspect-ratio:1;border-radius:16px;border:3px solid var(--ink);
  box-shadow:7px 7px 0 var(--pink),-7px -7px 0 var(--cyan);transform:rotate(-1deg);object-fit:cover;margin-top:10px}
.kicker{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--lime);margin:8px 0 0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;margin:0;text-wrap:balance;
  color:var(--ink);text-shadow:3px 3px 0 var(--pink),-2px -2px 0 var(--cyan)}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-weight:700;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;margin:0;padding:0;list-style:none}
.tags li:nth-child(1){color:var(--ink)}.tags li:nth-child(2){color:var(--lime)}.tags li:nth-child(3){color:var(--cyan)}.tags li:nth-child(4){color:var(--pink)}

/* Menú de escenarios */
.menu{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-top:-56px;margin-inline:auto;max-width:700px;padding:12px;
  background:rgba(15,20,32,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:2px solid var(--line);border-radius:16px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.7)}
.menu-label{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin:0 0 8px;font-weight:700}
@media (min-width:640px){.menu{margin-top:-64px}}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.tabs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tab{--c:var(--pink);appearance:none;border:2px solid var(--c);background:var(--wall-2);color:var(--ink);font:inherit;font-weight:700;
  padding:10px 10px;border-radius:10px;cursor:pointer;text-align:left;display:grid;gap:2px;transition:transform .15s,background .15s}
.tab small{font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.tab:hover{transform:translateY(-2px)}
.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tab[aria-selected="true"]{background:var(--c);color:var(--wall);box-shadow:3px 3px 0 var(--ink)}
.tab[aria-selected="true"] small{color:var(--wall)}

/* Panel */
.panel{margin-top:18px;--c:var(--pink)}
.panel-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;border-bottom:3px dashed var(--c);padding-bottom:10px;margin-bottom:18px}
.panel-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,6vw,2.4rem);margin:0;color:var(--c);line-height:1.1}

.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.slot{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:stretch}
.time{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.05rem;color:var(--c);padding-top:12px;text-align:right;line-height:1.2}
.time span{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.card{background:var(--wall-2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0;font-size:1.05rem;font-weight:700;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.chip.rifa{color:var(--lime)}
.chip.top{color:var(--orange)}
.slot.highlight .card{box-shadow:0 0 0 1px var(--c),0 0 22px -6px var(--c)}

/* Amenidades */
.amen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;list-style:none;margin:0;padding:0}
.amen li{background:var(--wall-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:4px}
.amen b{font-size:1rem}
.amen span{font-size:.82rem;color:var(--muted)}
.note{margin-top:16px;font-size:.9rem;color:var(--muted)}

footer{margin-top:40px;text-align:center;display:grid;gap:6px}
footer .slogan{font-family:var(--f-display);font-size:1.5rem;color:var(--lime);margin:0}
footer p{margin:0;font-size:.82rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.poster{transform:none}}
</style>

    <p class="slogan">La rave es mejor juntos</p>
    <p>Misma escuela, mismo espíritu · Horarios sujetos a cambios</p>
  </footer>
</div>

<script>
const STAGES = [
  {id:"principal", name:"Escenario Principal", short:"Shows y rifas", color:"var(--pink)",
   
   items:[
    {t:"9:30",  what:"Apertura con Cris Almaguer", tags:["rifa"]},
    {t:"10:00", what:"Carrera de botargas"},
    {t:"10:30", what:"Baile K-pop y animación", tags:["rifa"]},
    {t:"11:00", end:"12:00", what:"Show de reguetón", top:true},
    {t:"12:00", what:"Actividad SORPRESA", tags:["rifa"], top:true},
    {t:"12:30", what:"Ring Royale Bulldog", top:true},
    {t:"1:00",  what:"Porristas EIAO y premiación deportiva"}
   ]},
  {id:"auditorio", name:"Auditorio", short:"Teatro y conciertos", color:"var(--cyan)",
   
   items:[
    {t:"9:00",  what:"Inauguración del evento", top:true},
    {t:"10:00", end:"11:00", what:"Obra teatral: La fábrica de los juguetes"},
    {t:"11:00", what:"Concierto musical: Club Gpe"},
    {t:"11:30", what:"Concierto musical: Mty 1"},
    {t:"12:30", what:"Equipo Artes FTSyDH"}
   ]},
  {id:"campo", name:"Campo Deportivo", short:"Torneo de futbol", color:"var(--lime)",
   
   items:[
    {t:"9:30",  what:"Sorteo de equipos de futbol"},
    {t:"10:00", end:"11:30", what:"Eliminatorias"},
    {t:"11:30", what:"Animación y porristas EIAO"},
    {t:"12:30", what:"Semifinales"},
    {t:"1:00",  what:"Gran final", top:true}
   ]},
  {id:"amenidades", name:"Amenidades", short:"Todo el evento", color:"var(--orange)",
   amen:[
    ["Bungee","Salta cuando quieras"],["Futbolitos","Retas toda la mañana"],["Mesa de hockey","Arma tu torneo"],
    ["Rifas","Boletos durante el evento"],["Merch oficial EIAO","Llévate tu recuerdo"],["Hidratación","Agua para todos"],
    ["Premios y sorpresas","Atento a los anuncios"],["Expo Artes","Trabajos de alumnos"],["Recorrido académico","Conoce tu escuela"]
   ]}
];

const tabsEl = document.getElementById("tabs");
const panel = document.getElementById("panel");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ampm = t => { const h = parseInt(t,10); return (h >= 9 && h <= 11) ? "a. m." : "p. m."; };

STAGES.forEach(s => {
  const b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.id = "tab-" + s.id;
  b.setAttribute("role","tab"); b.setAttribute("aria-controls","panel");
  b.style.setProperty("--c", s.color);
  b.innerHTML = `<span>${esc(s.name)}</span><small>${esc(s.short)}</small>`;
  b.addEventListener("click", () => show(s.id, true));
  tabsEl.appendChild(b);
});

function show(id, user){
  const s = STAGES.find(x => x.id === id) || STAGES[0];
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.id === "tab-" + s.id ? "true" : "false"));
  panel.style.setProperty("--c", s.color);
  panel.setAttribute("aria-labelledby","tab-" + s.id);
  let body;
  if (s.amen){
    body = `<ul class="amen">${s.amen.map(([a,b]) => `<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join("")}</ul>
      <p class="note">Disponibles de 9:00 a. m. al cierre. Pregunta en los módulos por horarios de rifas y premios.</p>`;
  } else {
    body = `<ol class="timeline">${s.items.map(i => `
      <li class="slot${i.top ? " highlight" : ""}">
        <div class="time">${i.t}<span>${i.end ? "a " + i.end + " " + ampm(i.end) : ampm(i.t)}</span></div>
        <div class="card"><h3>${esc(i.what)}</h3>${(i.tags||i.top) ? `<div class="chips">${(i.tags||[]).map(()=>`<span class="chip rifa">Rifas</span>`).join("")}${i.top ? `<span class="chip top">Imperdible</span>` : ""}</div>` : ""}</div>
      </li>`).join("")}</ol>`;
  }
  panel.innerHTML = `<div class="panel-head"><h2>${esc(s.name)}</h2></div>${body}`;
  try { history.replaceState(null, "", "#" + s.id); } catch(e) {}
  if (user) { const top = panel.getBoundingClientRect().top + window.scrollY - 150; if (window.scrollY > top) window.scrollTo({top, behavior:"smooth"}); }
}

show((location.hash || "").slice(1) || "principal");
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
</script>
